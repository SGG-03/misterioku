
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171426">
<title>MisterioKU - Resuelve el misterio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171426;color:#f8f4ff;font-family:system-ui,Arial,sans-serif}
header{text-align:center;padding:26px 15px 18px;background:#211c37;border-bottom:1px solid #44365e}
.logo{font-size:13px;letter-spacing:5px;color:#d9b9ff}
h1{margin:8px 0;font-size:34px}
header p{color:#c9bfdc;margin:0}
main{max-width:720px;margin:auto;padding:20px 15px 45px}
.card{background:#252039;border:1px solid #44365e;border-radius:18px;padding:20px;margin-bottom:16px}
.eyebrow{color:#d6b4ff;font-size:12px;letter-spacing:2px;font-weight:bold}
h2{margin:9px 0;font-size:25px}
p{line-height:1.55}
.muted{color:#c7bfd8}
.clue{padding:11px 12px;margin:8px 0;background:#1b182c;border-radius:10px;line-height:1.5}
label{display:block;font-weight:600;margin:15px 0 7px}
select{width:100%;padding:13px;border-radius:10px;border:1px solid #655580;background:#171426;color:white;font-size:16px}
button{border:0;border-radius:11px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#d8b7ff;color:#241632}
.secondary{background:#39304f;color:white;border:1px solid #655580}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions button{flex:1}
#feedback{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.5}
.good{background:#183b30;color:#c8ffe4}
.bad{background:#492b35;color:#ffe0e5}
.progress{height:7px;background:#413752;border-radius:10px;overflow:hidden;margin-top:13px}
#bar{height:100%;width:0;background:#d8b7ff;transition:width .3s}
footer{text-align:center;color:#a99fbd;font-size:12px;padding:0 15px 25px}
</style>
</head>
<body>
<header>
  <div class="logo">JUEGO DE INVESTIGACIÓN</div>
  <h1>🔎 MisterioKU</h1>
  <p>Observa las pistas. Descubre la verdad.</p>
</header>
<main>
  <section class="card">
    <div class="eyebrow" id="level">CASO 1 DE 3</div>
    <h2 id="title">El secreto de la mansión</h2>
    <p id="story"></p>
    <div class="progress"><div id="bar"></div></div>
  </section>

  <section class="card">
    <div class="eyebrow">🕵️ INFORME DE INVESTIGACIÓN</div>
    <h2>Las pistas</h2>
    <div id="clues"></div>
    <div class="actions">
      <button class="secondary" id="hint">💡 Dame una pista</button>
      <button class="secondary" id="reset">↻ Borrar respuestas</button>
    </div>
    <p class="muted" id="hintText" aria-live="polite"></p>
  </section>

  <section class="card">
    <div class="eyebrow">TU DEDUCCIÓN</div>
    <h2>¿Quién lo hizo?</h2>
    <label for="suspect">Sospechoso</label>
    <select id="suspect"></select>
    <label for="room">Habitación</label>
    <select id="room"></select>
    <label for="object">Objeto relacionado</label>
    <select id="object"></select>
    <div class="actions">
      <button class="primary" id="check">Comprobar respuesta</button>
    </div>
    <div id="feedback" aria-live="polite"></div>
    <div class="actions" id="nextArea" hidden>
      <button class="primary" id="next">Siguiente misterio →</button>
    </div>
  </section>
</main>
<footer>Prototipo original de MisterioKU · Nuevos casos por descubrir</footer>
<script>
const cases = [
{
 title:"El secreto de la mansión",
 story:"Ha desaparecido el diamante de la mansión. Descubre quién lo escondió, dónde y qué objeto utilizó para transportarlo.",
 suspects:["Clara","Bruno","Elena","Marcos"],
 rooms:["Jardín","Salón","Cocina","Biblioteca"],
 objects:["Bolso","Caja","Mochila","Maletín"],
 answer:["Elena","Biblioteca","Caja"],
 clues:[
 "Clara estaba en el jardín cuando desapareció el diamante.",
 "Bruno se encontraba en la cocina y no salió de allí.",
 "Marcos fue visto en el salón. Elena fue la única persona que entró en la biblioteca.",
 "El diamante estaba escondido dentro de una caja."
 ],
 hints:[
 "Descarta a Clara y a Bruno por sus ubicaciones.",
 "Compara las habitaciones mencionadas con las opciones de respuesta.",
 "La última pista identifica el objeto. Las pistas de ubicación señalan a Elena y la biblioteca."
 ]
},
{
 title:"El reloj desaparecido",
 story:"Un reloj antiguo ha desaparecido durante una cena. Averigua quién lo tomó, en qué habitación y dónde lo guardó.",
 suspects:["Lucía","Diego","Marta","Pablo"],
 rooms:["Terraza","Despacho","Comedor","Dormitorio"],
 objects:["Cajón","Bolso","Baúl","Estuche"],
 answer:["Marta","Despacho","Estuche"],
 clues:[
 "Lucía permaneció en la terraza durante toda la cena.",
 "Diego no entró en el despacho ni en el dormitorio.",
 "Pablo estuvo en el comedor. Marta fue vista entrando sola en el despacho.",
 "El reloj se encontró protegido dentro de un estuche."
 ],
 hints:[
 "Lucía y Diego quedan descartados por las primeras pistas.",
 "La ubicación de Pablo lo descarta como responsable.",
 "La habitación y el objeto se indican en las dos últimas pistas."
 ]
},
{
 title:"El misterio del museo",
 story:"Una joya ha desaparecido de una exposición privada. Resuelve el último caso para convertirte en detective de MisterioKU.",
 suspects:["Andrés","Sofía","Hugo","Irene"],
 rooms:["Archivo","Galería","Laboratorio","Almacén"],
 objects:["Sobre","Mochila","Carpeta","Maletín"],
 answer:["Irene","Almacén","Carpeta"],
 clues:[
 "Andrés estuvo en la galería y no entró en otras salas.",
 "Sofía permaneció en el laboratorio acompañada por un vigilante.",
 "Hugo fue visto en el archivo. Irene fue la única persona que accedió al almacén.",
 "La joya apareció oculta dentro de una carpeta."
 ],
 hints:[
 "Las pistas descartan a Andrés y a Sofía.",
 "Hugo estaba en el archivo, no en el almacén.",
 "La última pista revela el objeto utilizado."
 ]
}
];
let current=0, hintIndex=0, solved=[false,false,false];
const $=id=>document.getElementById(id);
function fillSelect(id,items,label){
 const el=$(id);el.innerHTML="";
 const first=document.createElement("option");
 first.value="";first.textContent="Elige una opción";
 el.appendChild(first);
 items.forEach(item=>{
  const op=document.createElement("option");
  op.value=item;op.textContent=item;el.appendChild(op);
 });
}
function render(){
 const c=cases[current];
 $("level").textContent="CASO "+(current+1)+" DE "+cases.length;
 $("title").textContent=c.title;
 $("story").textContent=c.story;
 $("clues").innerHTML="";
 c.clues.forEach((clue,i)=>{
  const div=document.createElement("div");
  div.className="clue";
  div.textContent=(i+1)+". "+clue;
  $("clues").appendChild(div);
 });
 fillSelect("suspect",c.suspects);
 fillSelect("room",c.rooms);
 fillSelect("object",c.objects);
 $("hintText").textContent="";
 $("feedback").style.display="none";
 $("nextArea").hidden=true;
 $("check").disabled=false;
 $("hint").disabled=false;
 $("bar").style.width=(solved.filter(Boolean).length/cases.length*100)+"%";
 $("next").textContent=current===cases.length-1?"Volver a jugar ↻":"Siguiente misterio →";
}
$("hint").addEventListener("click",()=>{
 const c=cases[current];
 $("hintText").textContent=hintIndex<c.hints.length?c.hints[hintIndex]:"Lee otra vez todas las pistas y compara tus deducciones.";
 hintIndex++;
});
$("reset").addEventListener("click",()=>{
 ["suspect","room","object"].forEach(id=>$(id).value="");
 $("feedback").style.display="none";
 $("nextArea").hidden=true;
});
$("check").addEventListener("click",()=>{
 const c=cases[current];
 const feedback=$("feedback");
 feedback.style.display="block";
 if(!$("suspect").value||!$("room").value||!$("object").value){
  feedback.className="bad";
  feedback.textContent="Elige una respuesta en los tres apartados antes de comprobar.";
  return;
 }
 const answer=[$("suspect").value,$("room").value,$("object").value];
 if(answer.every((v,i)=>v===c.answer[i])){
  solved[current]=true;
  feedback.className="good";
  feedback.textContent=current===cases.length-1
   ?"¡Caso resuelto! 🏆 Has completado todos los misterios de esta demo. ¡Eres detective de MisterioKU!"
   :"¡Correcto! 🎉 Has resuelto el caso. Ya puedes avanzar al siguiente misterio.";
  $("nextArea").hidden=false;
  $("check").disabled=true;
  $("hint").disabled=true;
  $("bar").style.width=(solved.filter(Boolean).length/cases.length*100)+"%";
 }else{
  feedback.className="bad";
  feedback.textContent="Todavía no es correcto. Relee las pistas, descarta opciones y vuelve a intentarlo.";
 }
});
$("next").addEventListener("click",()=>{
 if(current===cases.length-1){
  current=0;hintIndex=0;solved=[false,false,false];
 }else{
  current++;hintIndex=0;
 }
 render();
 window.scrollTo({top:0,behavior:"smooth"});
});
render();
</script>
</body>
</html>
